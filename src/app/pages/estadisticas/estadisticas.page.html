<ion-content [fullscreen]="true" class="page-background">

  <div class="phone-frame">
    <div class="phone-notch"></div>

    <div class="phone-screen">
      <h1 class="page-title">Estadísticas</h1>

      <!-- Gráfico simulado -->
      <div class="card chart-card">
        <div class="chart-placeholder">
          <div class="chart-line"></div>
          <div class="chart-line"></div>
          <div class="chart-line"></div>
          <div class="chart-line"></div>
        </div>
        <div class="chart-labels">
          <span>D</span><span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span>
        </div>
      </div>

      <!-- Resumen de hábitos completados -->
      <div class="card summary-card">
        <p class="summary-title">Hábitos completados</p>
        <p class="summary-subtitle">Esta semana</p>
        <p class="summary-number">21</p>
      </div>

      <!-- Menú inferior -->
      <div class="bottom-nav">
        <button class="nav-item" (click)="irADashboard()">
          <span class="nav-icon">☰</span>
          <span class="nav-text">Dashboard</span>
        </button>
        <button class="nav-item active" (click)="irAEstadisticas()">
          <span class="nav-icon">📊</span>
          <span class="nav-text">Estadísticas</span>
        </button>
        <button class="nav-item" (click)="irALogros()">
          <span class="nav-icon">🏆</span>
          <span class="nav-text">Logros</span>
        </button>
        <button class="nav-item" (click)="irAConfiguracion()">
          <span class="nav-icon">⚙️</span>
          <span class="nav-text">Config.</span>
        </button>
      </div>
    </div>
  </div>

</ion-content>
