<ion-content [fullscreen]="true" class="page-background">

  <div class="phone-frame">
    <div class="phone-notch"></div>

    <div class="phone-screen">
      <h1 class="page-title">Configuración</h1>

      <div class="options-list">
        <button class="option-item">Cuenta</button>
        <button class="option-item">Notificaciones</button>
        <button class="option-item">Recordatorio diario</button>
        <button class="option-item">Seguridad</button>
        <button class="option-item">Acerca de</button>
      </div>

      <!-- Menú inferior -->
      <div class="bottom-nav">
        <button class="nav-item" (click)="irADashboard()">
          <span class="nav-icon">☰</span>
          <span class="nav-text">Dashboard</span>
        </button>
        <button class="nav-item" (click)="irAEstadisticas()">
          <span class="nav-icon">📊</span>
          <span class="nav-text">Estadísticas</span>
        </button>
        <button class="nav-item" (click)="irALogros()">
          <span class="nav-icon">🏆</span>
          <span class="nav-text">Logros</span>
        </button>
        <button class="nav-item active" (click)="irAConfiguracion()">
          <span class="nav-icon">⚙️</span>
          <span class="nav-text">Config.</span>
        </button>
      </div>
    </div>
  </div>

</ion-content>
