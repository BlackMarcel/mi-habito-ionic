<ion-content [fullscreen]="true" class="dashboard-background">

  <div class="phone-frame">
    <div class="phone-notch"></div>

    <div class="phone-screen">

      <div class="header-row">
        <h1 class="app-title">Mi Hábito</h1>
      </div>

      <h2 class="section-title">Panel de Control</h2>

      <!-- Tarjeta de hábito actual -->
      <div class="card habit-card">
        <div class="card-title-row">
          <span class="card-title">Hábito actual</span>
          <span class="card-percent">60 %</span>
        </div>

        <div class="progress-bar">
          <div class="progress-fill"></div>
        </div>
      </div>

      <!-- Botones de navegación a otras pantallas -->
      <div class="nav-list">

        <button class="nav-card" (click)="irADetalleHabito()">
          <span class="nav-icon">☰</span>
          <span class="nav-text">Detalle de Hábito</span>
        </button>

        <button class="nav-card" (click)="irAEstadisticas()">
          <span class="nav-icon">📊</span>
          <span class="nav-text">Estadísticas</span>
        </button>

        <button class="nav-card" (click)="irALogros()">
          <span class="nav-icon">★</span>
          <span class="nav-text">Logros / Insignias</span>
        </button>

        <button class="nav-card" (click)="irAConfiguracion()">
          <span class="nav-icon">⚙️</span>
          <span class="nav-text">Configuración</span>
        </button>

      </div>

      <button class="link-button" (click)="volverInicio()">
        Cerrar sesión
      </button>

    </div>
  </div>

</ion-content>
